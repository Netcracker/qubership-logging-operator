name: Go test with Sonar
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - .github/workflows/go-test.yaml
      - .github/config/build-config.yaml
      - api/**
      - cmd/**
      - controllers/**
      - go.*
      - Makefile
      - test/envtests/**
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sonar-project-key: ${{ steps.config.outputs.sonar-project-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve sonar project key based on restricted actors
        id: config
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          restricted=$(python3 -c "
          import yaml, os
          with open('.github/config/build-config.yaml') as f:
              config = yaml.safe_load(f)
          actors = config.get('restricted-actors', [])
          print('true' if os.environ['ACTOR'] in actors else 'false')
          ")
          if [ "$restricted" = "true" ]; then
            echo "sonar-project-key=" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "sonar-project-key=" >> "$GITHUB_OUTPUT"
          else
            echo "sonar-project-key=${{ vars.SONAR_PROJECT_KEY }}" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: prepare
    name: Build and test with coverage
    uses: netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@71206242f5967ac6691337913593f8623863f711 # v2.5.2
    with:
      go-module-dir: '.'
      sonar-project-key: ${{ needs.prepare.outputs.sonar-project-key }}
      cover-packages: './controllers/...'
      skip-docker: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      packages: write

  ci-gate:
    name: CI Gate
    needs: [prepare, test]
    # Runs even when a dependency fails, so the check resolves instead of being skipped.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
