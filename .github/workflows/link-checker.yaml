---
name: "Lint: Check links in documentation"

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/link-checker.yaml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/link-checker.yaml'

permissions:
  contents: read

concurrency:
  group: link-checker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore lychee cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: restore-cache
        with:
          path: .lycheecache
          key: cache-lychee-${{ runner.os }}-${{ hashFiles('**/*.md') }}
          restore-keys: cache-lychee-${{ runner.os }}-
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            './**/*.md'
            --verbose
            --no-progress
            --user-agent 'curl/8.5.0'
            --retry-wait-time 60
            --max-retries 8
            --accept 100..=103,200..=299,302,429
            --cookie-jar cookies.json
            --exclude-all-private
            --max-concurrency 4
            --cache
            --cache-exclude-status '429, 500..502'
            --max-cache-age 1d
          format: markdown
          fail: true
      - name: Save lychee cache
        if: ${{ always() && steps.restore-cache.outputs.cache-hit != 'true' && hashFiles('.lycheecache/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}
