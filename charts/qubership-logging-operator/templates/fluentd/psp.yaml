{{- if .Capabilities.APIVersions.Has "policy/v1beta1" }}
{{- if .Values.createClusterAdminEntities }}
{{- if .Values.fluentd.install }}
{{- if .Values.fluentd.securityResources.install }}
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: {{ .Values.fluentd.securityResources.name }}
  annotations:
    kubernetes.io/description: {{ .Values.fluentd.securityResources.name }} psp is used for the fluentd daemonset
  {{- if .Values.fluentd.annotations }}
    {{- toYaml .Values.fluentd.annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "logging.labels" (dict "ctx" . "name" .Values.fluentd.securityResources.name "component" "fluentd") | nindent 4 }}
    {{- if .Values.fluentd.labels }}
    {{- include "logging.extraLabels" (dict "ctx" . "extraLabels" .Values.fluentd.labels) | nindent 4 }}
    {{- end }}
spec:
  privileged: {{ .Values.fluentd.securityContextPrivileged }}
  allowPrivilegeEscalation: {{ .Values.fluentd.securityContextPrivileged }}
  {{- if not .Values.fluentd.securityContextPrivileged }}
  requiredDropCapabilities:
    - ALL
  {{- end }}
  allowedHostPaths:
    - pathPrefix: /etc/sysconfig/docker
      readOnly: true
    - pathPrefix: /etc/docker/daemon.json
      readOnly: true
    - pathPrefix: /etc/hostname
      readOnly: true
    - pathPrefix: /var/log
      readOnly: false
    - pathPrefix: /var/lib/docker/containers
      readOnly: true
  # Allow core volume types.
  volumes:
    - 'configMap'
    - 'secret'
    - 'hostPath'
    - 'emptyDir'
    - 'projected'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    # Permits the container to run with root privileges as well.
    rule: 'RunAsAny'
  seLinux:
    # This policy assumes the nodes are using AppArmor rather than SELinux.
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      # Allow adding the root group.
      - min: 0
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      # Allow adding the root group.
      - min: 0
        max: 65535
  readOnlyRootFilesystem: true
{{- end }}
{{- end }}
{{- end }}
{{- end }}
