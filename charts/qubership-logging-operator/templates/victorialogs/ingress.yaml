{{- if and .Values.victorialogs.install .Values.victorialogs.ingress.install }}
{{- $addConverterIgnore := and .Values.victorialogs.httpRoute.install .Values.victorialogs.addIngressIgnoreAnnotation }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "victorialogs.vmauthFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "victorialogs.vmauthLabels" . | nindent 4 }}
    {{- with .Values.victorialogs.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .Values.victorialogs.ingress.annotations $addConverterIgnore }}
  annotations:
    {{- with .Values.victorialogs.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $addConverterIgnore }}
    gateway-api-converter.netcracker.com/ignore: "true"
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.victorialogs.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.victorialogs.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- $hosts := .Values.victorialogs.ingress.hosts }}
    {{- if not $hosts }}
    {{- $hosts = list (dict "host" (include "victorialogs.externalHost" .) "paths" (list (dict "path" "/" "pathType" "Prefix"))) }}
    {{- end }}
    {{- range $hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "victorialogs.vmauthFullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
