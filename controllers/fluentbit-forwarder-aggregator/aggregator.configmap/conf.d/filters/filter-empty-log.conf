[FILTER]
    Name         modify
    Match        system.systemd
    Hard_rename  MESSAGE log

[FILTER]
    Name         modify
    Match_Regex  ^(audit[.]var[.]l(og|ib)[.](audit|openshift-apiserver|kube-apiserver|kubernetes[.]audit|kubernetes[.]kube-apiserver|origin[.]ocp-audit)).*
    Condition    Key_does_not_exist log
    Add          log (message)

[FILTER]
    Name         modify
    Match_Regex  ^(audit[.]var[.]l(og|ib)[.](audit|openshift-apiserver|kube-apiserver|kubernetes[.]audit|kubernetes[.]kube-apiserver|origin[.]ocp-audit)).*
    Copy         log  short_message

# Records re-emitted after early parsing do not expose log or short_message until post-generic processing.
[FILTER]
    Name         modify
    Match_Regex  ^(?!parsed[.]|audit[.]var[.]l(og|ib)[.](audit|openshift-apiserver|kube-apiserver|kubernetes[.]audit|kubernetes[.]kube-apiserver|origin[.]ocp-audit)).*
    Condition    Key_Does_Not_Exist log
    Condition    Key_Does_Not_Exist short_message
    Set          log ""

[FILTER]
    Name         grep
    Match_Regex  ^(?!parsed[.]|audit[.]var[.]l(og|ib)[.](audit|openshift-apiserver|kube-apiserver|kubernetes[.]audit|kubernetes[.]kube-apiserver|origin[.]ocp-audit)).*
    Logical_Op   or
    Exclude      log \A\s*\z
    Exclude      short_message \A\s*\z
