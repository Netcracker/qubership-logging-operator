# Keep the source message while parsers use _parser_input as a success marker
[FILTER]
    Name           modify
    Match          pods*
    Copy           log _parser_input

# First, we need to use specific parsers to parse the logs for Kubernetes components
# Kubernetes components
# DaemonSet: kube-proxy
# Pods: kube-scheduler, kube-controller-manager, kube-apiserver
# Should it be even here in generic filters?
[FILTER]
    Name           parser
    Match          pods*
    Key_Name       _parser_input
    Parser         klog_entry
    Reserve_Data   On
    Preserve_Key   Off

[FILTER]
    Name           parser
    Match          pods*
    Key_Name       _parser_input
    Parser         klog_trace_entry
    Reserve_Data   On
    Preserve_Key   Off

# CoreDNS
# Deployments: coredns
[FILTER]
    Name           parser
    Match_regex    pods.*coredns.*
    Key_Name       _parser_input
    Parser         coredns
    Reserve_Data   On
    Preserve_Key   Off

# NGINX ingress controller
[FILTER]
    Name           parser
    Match_Regex    pods.*nginx.*
    Key_Name       _parser_input
    Parser         k8s-nginx-ingress
    Reserve_Data   On
    Preserve_Key   Off

# Generic json parser
[FILTER]
    Name           parser
    Match          pods*
    Key_Name       _parser_input
    Parser         json
    Reserve_Data   On
    Preserve_Key   Off

# Second, we need to use specific parsers to parse the logs for well-known
# third-party applications with custom log formats

# Cassandra
[FILTER]
    Name           parser
    Match_Regex    pods.*cassandra.*
    Key_Name       _parser_input
    Parser         cassandra
    Reserve_Data   On
    Preserve_Key   Off

# Consul
[FILTER]
    Name           parser
    Match_Regex    pods.*consul.*
    Key_Name       _parser_input
    Parser         consul
    Reserve_Data   On
    Preserve_Key   Off

# PostgreSQL
# StatefulSet "pg-patroni-nodeX" (example, pg-patroni-node1)
[FILTER]
    Name           parser
    Match_Regex    pods.*(postgres|patroni|pg).*
    Key_Name       _parser_input
    Parser         postgres
    Reserve_Data   On
    Preserve_Key   Off

# Jaeger
[FILTER]
    Name           modify
    Match_Regex    pods.*jaeger.*
    Remove         ts

# MongoDB, StatefulSet "cnfrsX-X" (example, cnfrs0-0)
# mongo container in graylog statefulset
[FILTER]
    Name           modify
    Match_Regex    pods.*(mongo.*cnfrs|graylog.*mongo).*
    Rename         ctx    context
    Rename         c      component
    Rename         s      level
    Rename         attr   attributes
    Hard_rename    msg    short_message

[FILTER]
    Name           nest
    Match_Regex    pods.*(mongo.*cnfrs|graylog.*mongo).*
    Operation      lift
    Wildcard       t*
    Nest_under     t
    Remove_prefix  t.

[FILTER]
    Name           modify
    Match_Regex    pods.*(mongo.*cnfrs|graylog.*mongo).*
    Hard_rename    $date   date

# ArgoCD
# Deployments: argocd-server, argocd-repo-server, argocd-dex-server, argocd-notifications-controller, argocd-applicationset-controller
# StatefulSet: argocd-application-controller
[FILTER]
    Name           parser
    Match_Regex    pods.*argocd-(?!redis).*
    Key_Name       _parser_input
    Parser         logfmt
    Reserve_Data   On
    Preserve_Key   Off

[FILTER]
    Name           record_modifier
    Match_Regex    pods.*argocd-(?!redis).*
    Remove_Key     msg

# Fluentbit
[FILTER]
    Name           parser
    Match_Regex    pods.*fluentbit.*
    Key_Name       _parser_input
    Parser         fluentbit
    Reserve_Data   On
    Preserve_Key   Off

# Opensearch
[FILTER]
    Name           parser
    Match_Regex    pods.*opensearch-\d{1,2}_.*
    Key_Name       _parser_input
    Parser         opensearch
    Reserve_Data   On
    Preserve_Key   Off

# Qubership [key=value]
[FILTER]
    Name           parser
    Match          pods*
    Key_Name       _parser_input
    Parser         qubership
    Reserve_Data   On
    Preserve_Key   Off

# Java common format
[FILTER]
    Name           parser
    Match          pods*
    Key_Name       _parser_input
    Parser         java
    Reserve_Data   On
    Preserve_Key   Off

# Logfmt format detection - mark logs that should be parsed with logfmt
# This filter identifies logs that contain logfmt format but don't contain Qubership [key=value] format
[FILTER]
    Name           modify
    Match          pods*
    Condition      Key_value_matches        log    ^[a-zA-Z_][a-zA-Z0-9_]*=(?:(?:"(?:[^"\\]|\\.)*"|[^=\s"]+))(?:(?:\s+)[a-zA-Z_][a-zA-Z0-9_]*=(?:(?:"(?:[^"\\]|\\.)*"|[^=\s"]+)))*$
    Condition      Key_value_does_not_match log    \[[a-zA-Z_][a-zA-Z0-9_]*=[^\]]*\]
    Set            logfmt_candidate true

[FILTER]
    Name           parser
    Match          pods*
    Key_Name       _parser_input
    Parser         logfmt
    Reserve_Data   On
    Preserve_Key   Off

[FILTER]
    Name           parser
    Match_regex    pods.*calico-node.*
    Key_Name       _parser_input
    Parser         calico_tcp
    Reserve_Data   On
    Preserve_Key   Off
