# Only the remaining records need the field-count heuristic.
[FILTER]
    Name                 lua
    Match_regex          (pods|klog).*
    Script               /fluent-bit/etc/count_fields.lua
    Call                 first_count_fields

[FILTER]
    Name                 parser
    Match_regex          (pods|klog).*
    Key_Name             log
    Parser               json
    Reserve_Data         On
    Preserve_Key         On

[FILTER]
    Name                 modify
    Match_regex          (pods|klog).*
    Condition            Key_value_matches log ^\s*\{[\s\S]*\}\s*$
    Set                  json_candidate true

[FILTER]
    Name                 parser
    Match                pods*
    Key_Name             log
    Parser               logfmt
    Reserve_Data         On
    Preserve_Key         On

[FILTER]
    Name           modify
    Match          pods*
    Condition      Key_value_matches        log    ^[a-zA-Z_][a-zA-Z0-9_]*=(?:(?:"(?:[^"\\]|\\.)*"|[^=\s"]+))(?:(?:\s+)[a-zA-Z_][a-zA-Z0-9_]*=(?:(?:"(?:[^"\\]|\\.)*"|[^=\s"]+)))*$
    Condition      Key_value_does_not_match log    \[[a-zA-Z_][a-zA-Z0-9_]*=[^\]]*\]
    Set            logfmt_candidate true

[FILTER]
    Name                 lua
    Match_regex          (pods|klog).*
    Script               /fluent-bit/etc/count_fields.lua
    Call                 second_count_fields

[FILTER]
    Name                 modify
    Match_regex          (pods|klog).*
    Condition            Key_value_equals parse_status success
    Condition            Key_exists json_candidate
    Set                  parse_format json

[FILTER]
    Name                 modify
    Match_regex          (pods|klog).*
    Condition            Key_value_equals parse_status success
    Condition            Key_exists logfmt_candidate
    Set                  parse_format logfmt
