# The first matching format owns the record. Preserve raw text for final processing.
[FILTER]
    Name           parser
    Match_regex          (pods|klog).*
    Key_Name       log
    Parser         klog_trace_entry
    Reserve_Data   On
    Preserve_Key   On

[FILTER]
    Name                 modify
    Match_regex          (pods|klog).*
    Condition            Key_exists __klog_trace_entry_candidate
    Set                  parse_status success
    Set                  parse_format klog
    Hard_rename          log original_log

