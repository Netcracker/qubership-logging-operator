[FILTER]
    Name              lua
{{- if and .Values.Fluentbit.Aggregator.Output .Values.Fluentbit.Aggregator.Output.Http .Values.Fluentbit.Aggregator.Output.Http.Enabled .Values.Fluentbit.Aggregator.Output.Http.Routing .Values.Fluentbit.Aggregator.Output.Http.Routing.Enabled }}
    # HTTP routing re-emits records with out_* tags into the filter chain; skip them to avoid a second normalization pass.
    Match_regex       ^(?!out_(audit|k8s_event|nginx|access|int|pods|system|default)$).*
{{- else }}
    Match             *
{{- end }}
    script            /fluent-bit/etc/update_level_syslog.lua
    call              update_level
