# Recover raw text only after the generic parser chain has finished.
[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists original_log
    Hard_rename          original_log log

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__klog_trace_entry_candidate']
    Set                  parse_format klog

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__klog_entry_candidate']
    Set                  parse_format klog

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__coredns_candidate']
    Set                  parse_format coredns

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__k8s_nginx_ingress_candidate']
    Set                  parse_format k8s-nginx-ingress

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__cassandra_candidate']
    Set                  parse_format cassandra

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__consul_candidate']
    Set                  parse_format consul

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__postgres_candidate']
    Set                  parse_format postgres

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__fluentbit_candidate']
    Set                  parse_format fluentbit

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__opensearch_candidate']
    Set                  parse_format opensearch

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__calico_tcp_candidate']
    Set                  parse_format calico_tcp

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists $log_parsed['__qubership_candidate']
    Set                  parse_format qubership

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_exists log_parsed
    Condition            Key_does_not_exist parse_format
    Condition            Key_value_matches log ^\s*\{[\s\S]*\}\s*$
    Set                  parse_format json

[FILTER]
    Name           modify
    Match_regex          (parsed\.)?pods.*
    Condition      Key_value_matches        log    ^[a-zA-Z_][a-zA-Z0-9_]*=(?:(?:"(?:[^"\\]|\\.)*"|[^=\s"]+))(?:(?:\s+)[a-zA-Z_][a-zA-Z0-9_]*=(?:(?:"(?:[^"\\]|\\.)*"|[^=\s"]+)))*$
    Condition      Key_value_does_not_match log    \[[a-zA-Z_][a-zA-Z0-9_]*=[^\]]*\]
    Condition      Key_exists log_parsed
    Condition      Key_does_not_exist parse_format
    Set            parse_format logfmt

[FILTER]
    Name                 nest
    Match_regex          (parsed\.)?(pods|klog).*
    Operation            lift
    Nested_under         log_parsed

# Jaeger
[FILTER]
    Name           modify
    Match_Regex    (parsed\.)?pods.*jaeger.*
    Remove         ts

# MongoDB, StatefulSet "cnfrsX-X" (example, cnfrs0-0)
# mongo container in graylog statefulset
[FILTER]
    Name           modify
    Match_Regex    (parsed\.)?pods.*(mongo.*cnfrs|graylog.*mongo).*
    Rename         ctx    context
    Rename         c      component
    Rename         s      level
    Rename         attr   attributes
    Hard_rename    msg    short_message

[FILTER]
    Name           nest
    Match_Regex    (parsed\.)?pods.*(mongo.*cnfrs|graylog.*mongo).*
    Operation      lift
    Nested_under   t
    Remove_prefix  t.

[FILTER]
    Name           modify
    Match_Regex    (parsed\.)?pods.*(mongo.*cnfrs|graylog.*mongo).*
    Hard_rename    $date   date

# Preserve a level supplied by the selected parser.
[FILTER]
    Name                modify
    Match_regex               (parsed\.)?pods.*
    Condition           Key_does_not_exist level
    Copy                log __level_log

[FILTER]
    Name                parser
    Match_regex               (parsed\.)?pods.*
    Key_Name            __level_log
    Parser              level_parser_common_keep
    Reserve_Data        On
    Preserve_Key        On

[FILTER]
    Name                         modify
    Match_Regex                  (parsed\.)?pods.*grafana.*
    Condition Key_value_matches  log /Invalid\susername\sor\spassword|Successful\sLogin|Successful\sLogout|Failed\sto\slook\sup\suser\sbased\son\scookie/
    Set                          nc_audit_label true

[FILTER]
    Name                         modify
    Match_Regex                  (parsed\.)?pods.*mongo.*
    Condition Key_value_matches  log /ACCESS|CONTROL/
    Set                          nc_audit_label true

[FILTER]
    Name                         modify
    Match_regex                        (parsed\.)?pods.*
    Condition Key_value_matches  log /access-control|PG_SERVICE|database\ssystem\sis|audit_log_type|AUDIT|logType[\":\s\t=]*audit|org\.qubership\.security\.audit.*CEF|org\.qubership\.cloud\.keycloak\.provider.*/
    Set                          nc_audit_label true

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_value_equals parse_format json
    Rename               msg short_message
    Rename               message short_message

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_value_equals parse_format logfmt
    Rename               msg short_message
    Rename               message short_message
    Rename               time log_time

[FILTER]
    Name                 lua
    Match_regex          (parsed\.)?(pods|klog).*
    Script               /fluent-bit/etc/parse_key_value.lua
    Call                 kv_parse

# Provide a message for valid Qubership records with no message text.
[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Condition            Key_value_equals parse_format qubership
    Condition            Key_does_not_exist short_message
    Set                  short_message "<Empty message>"

[FILTER]
    Name                 modify
    Match_regex          (parsed\.)?(pods|klog).*
    Copy                 log short_message
    Add                  parse_status failed
    Add                  parse_format unknown

[FILTER]
    Name                 record_modifier
    Match_regex          (parsed\.)?(pods|klog).*
    Remove_key           __early_parsed
    Remove_key           __level_log
    Remove_key           orig_field_count
    Remove_key           log
    Remove_key           original_log
    Remove_key           json_candidate
    Remove_key           logfmt_candidate
    Remove_key           __klog_trace_entry_candidate
    Remove_key           __klog_entry_candidate
    Remove_key           __coredns_candidate
    Remove_key           __k8s_nginx_ingress_candidate
    Remove_key           __cassandra_candidate
    Remove_key           __consul_candidate
    Remove_key           __postgres_candidate
    Remove_key           __fluentbit_candidate
    Remove_key           __opensearch_candidate
    Remove_key           __calico_tcp_candidate
    Remove_key           __qubership_candidate
