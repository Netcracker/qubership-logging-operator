# Parses host system logs from /var/log/messages and /var/log/syslog.
#
# The tail inputs carry no parser of their own. A parser on the input gets one attempt, and a
# line it does not match reaches the output as raw text with no level and no timestamp of its
# own. Running the parsers here instead gives every line the whole chain, and a line that
# matches nothing still keeps its raw text.
#
# Only the file inputs are matched. Records from the systemd input arrive already structured
# and carry no syslog envelope, so the tag of a tail input gates this chain.

# The syslog envelope. The three formats are mutually exclusive, so order only decides which
# one answers first; the RFC 3339 variants differ by the fractional seconds Fluent Bit needs
# to match %L.
[FILTER]
    Name           parser
    Match_Regex    ^system\.var\.log\.
    Key_Name       log
    Parser         syslog_rfc3164
    Reserve_Data   On
    Preserve_Key   Off

[FILTER]
    Name           parser
    Match_Regex    ^system\.var\.log\.
    Key_Name       log
    Parser         syslog_rfc3339
    Reserve_Data   On
    Preserve_Key   Off

[FILTER]
    Name           parser
    Match_Regex    ^system\.var\.log\.
    Key_Name       log
    Parser         syslog_rfc3339_seconds
    Reserve_Data   On
    Preserve_Key   Off

# Each envelope parser consumes the log key and leaves the body in syslog_message. Moving it
# back to log keeps the field the gelf output reads as the full message, and gives the
# application parsers below a key to work on.
[FILTER]
    Name           modify
    Match_Regex    ^system\.var\.log\.
    Hard_rename    syslog_message       log

# The application format inside the syslog message, which is where the level lives: RFC 3164
# has no level field, and the host writes no PRI into the file. Without this step every system
# record reaches the output as info, because update_level_syslog.lua defaults a missing level.
[FILTER]
    Name           parser
    Match          system*
    Key_Name       log
    Parser         klog_entry
    Reserve_Data   On
    Preserve_Key   On

[FILTER]
    Name           parser
    Match          system*
    Key_Name       log
    Parser         logfmt
    Reserve_Data   On
    Preserve_Key   On

# logfmt names its fields after the keys it finds. Rename the two that collide with the
# pipeline's own, as filter-post-generic.conf does for container logs.
[FILTER]
    Name           modify
    Match          system*
    Condition      Key_exists           msg
    Rename         msg                  short_message

[FILTER]
    Name           modify
    Match          system*
    Condition      Key_exists           time
    Rename         time                 log_time

# A line whose application format is unknown still needs the short message the gelf output
# reads, so fall back to the syslog message body. Copy leaves an existing value alone.
[FILTER]
    Name           modify
    Match          system*
    Copy           log                  short_message
