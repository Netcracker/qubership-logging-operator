{{- if and .Values.Fluentbit.Aggregator.Output .Values.Fluentbit.Aggregator.Output.Http .Values.Fluentbit.Aggregator.Output.Http.Enabled }}
# Skip the records stream routing re-emitted: they already carry the renamed field from the pass
# that produced them, and a second pass would only repeat the work.
[FILTER]
    Name                   modify
    Match_regex            ^(?!out_).*
    Hard_rename            stream            log_category
{{- if and .Values.Fluentbit.Aggregator.Output.Http.Routing .Values.Fluentbit.Aggregator.Output.Http.Routing.Enabled }}
# Stream routing for the HTTP output.
# vmauth matches static header values only, so every record is retagged with a static prefix
# instead of the input tag, which carries the log file path. The retagged records are what the
# GELF, Loki and OpenTelemetry outputs receive too, so their matchers accept the out_ prefix.
[FILTER]
    Name                   rewrite_tag
    Match                  pods*
    Rule                   $nc_audit_label   true               out_audit        false
    Rule                   $kind             KubernetesEvent    out_k8s_event    false
    Rule                   $pod              .*ingress-nginx.*  out_nginx        false
    Rule                   $log_type         access             out_access       false
    Rule                   $log_type         int                out_int          false
    Rule                   $pod              ^.*$               out_pods         false
    emitter_mem_buf_limit  64M

[FILTER]
    Name                   rewrite_tag
    Match                  klog*
    Rule                   $pod              ^.*$               out_pods    false

# The Match line above selects the stream, so the rule only has to fire. A rule key is a record
# accessor and cannot address the tag, so it reads a field that every record carries.
[FILTER]
    Name                   rewrite_tag
    Match                  audit*
    Rule                   $hostname         ^.*$               out_audit   false

[FILTER]
    Name                   rewrite_tag
    Match                  system*
    Rule                   $hostname         ^.*$               out_system  false

[FILTER]
    Name                   rewrite_tag
    Match_regex            ^(?!out_).*
    Rule                   $hostname         ^.*$               out_default false
{{- end }}

[OUTPUT]
    name                   http
    Match                  *
    host                   {{ .Values.Fluentbit.Aggregator.Output.Http.Host }}
    port                   {{ .Values.Fluentbit.Aggregator.Output.Http.Port | default 9428 }}
    uri                    {{ .Values.Fluentbit.Aggregator.Output.Http.Uri | default "/insert/jsonline?_stream_fields=namespace,container&_msg_field=short_message&_time_field=time" }}
    json_date_format       {{ .Values.Fluentbit.Aggregator.Output.Http.JsonDateFormat | default "iso8601" }}
{{- if and .Values.Fluentbit.Aggregator.Output.Http.Routing .Values.Fluentbit.Aggregator.Output.Http.Routing.Enabled }}
    # Optional header to propagate log's tag which indicates the log type, default is "X-Log-Type". Used by vmauth for routing logs to different vlsingle instances
    header_tag             {{ .Values.Fluentbit.Aggregator.Output.Http.Routing.HeaderTag | default "X-Log-Type" }}
{{- end }}
{{- if .Values.Fluentbit.Aggregator.Output.Http.Auth }}
{{- if .Values.Fluentbit.Aggregator.Output.Http.Auth.Token }}
    header                 Authorization    Bearer {{ .OutputCredentials.Http.Token }}
{{- end }}
{{- if and .Values.Fluentbit.Aggregator.Output.Http.Auth.User .Values.Fluentbit.Aggregator.Output.Http.Auth.Password }}
    http_user              {{ .OutputCredentials.Http.User }}
    http_passwd            {{ .OutputCredentials.Http.Password }}
{{- end }}
{{- end }}
    compress               {{ .Values.Fluentbit.Aggregator.Output.Http.Compress | default "gzip" }}
    format                 {{ .Values.Fluentbit.Aggregator.Output.Http.Format | default "json_lines" }}
{{- if .Values.Fluentbit.Aggregator.Output.Http.TLS }}
    tls                    {{ if .Values.Fluentbit.Aggregator.Output.Http.TLS.Enabled }}On{{ else }}Off{{ end }}
{{- if .Values.Fluentbit.Aggregator.Output.Http.TLS.Enabled }}
{{- if .Values.Fluentbit.Aggregator.Output.Http.TLS.Verify }}
    tls.verify             On
{{- else }}
    tls.verify             Off
{{- end }}
{{- if and .Values.Fluentbit.Aggregator.Output.Http.TLS.CA .Values.Fluentbit.Aggregator.Output.Http.TLS.CA.SecretName .Values.Fluentbit.Aggregator.Output.Http.TLS.CA.SecretKey }}
    tls.ca_file            /fluent-bit/output/http/tls/ca.crt
{{- end }}
{{- if and .Values.Fluentbit.Aggregator.Output.Http.TLS.Cert .Values.Fluentbit.Aggregator.Output.Http.TLS.Cert.SecretName .Values.Fluentbit.Aggregator.Output.Http.TLS.Cert.SecretKey }}
    tls.crt_file           /fluent-bit/output/http/tls/tls.crt
{{- end }}
{{- if and .Values.Fluentbit.Aggregator.Output.Http.TLS.Key .Values.Fluentbit.Aggregator.Output.Http.TLS.Key.SecretName .Values.Fluentbit.Aggregator.Output.Http.TLS.Key.SecretKey }}
    tls.key_file           /fluent-bit/output/http/tls/tls.key
{{- end }}
{{- if .Values.Fluentbit.Aggregator.Output.Http.TLS.KeyPasswd }}
    tls.key_passwd         {{ .Values.Fluentbit.Aggregator.Output.Http.TLS.KeyPasswd }}
{{- end -}}
{{- end -}}
{{- end -}}
{{ .Values.Fluentbit.Aggregator.Output.Http.ExtraParams | default "" | nindent 4 }}
{{- end }}
