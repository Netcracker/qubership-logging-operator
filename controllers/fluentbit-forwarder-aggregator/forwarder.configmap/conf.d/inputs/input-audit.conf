{{- if .Values.Fluentbit.SystemAuditLogging }}
[INPUT]
    Name               tail
    Tag                audit.*
    Path               /var/log/audit/audit.log
    Path_Key           tag
    Parser             audit
{{- if .Values.Fluentbit.DB.IsEnabled }}
    DB                 /fluent-bit/state/audit.db
    DB.journal_mode    {{ default "memory" .Values.Fluentbit.DB.JournalMode }}
    DB.sync            {{ default "off" .Values.Fluentbit.DB.Sync }}
    DB.locking         {{ .Values.Fluentbit.DB.IsLocking }}
{{- end }}
    Read_from_Head     False
    Mem_Buf_Limit      10M
    Skip_Long_Lines    On
    Skip_Empty_Lines   On
    Refresh_Interval   60
    storage.type       {{ if .Values.Fluentbit.UsesFilesystemBuffer }}filesystem{{ else }}memory{{ end }}
    Buffer_Chunk_Size  64KB
    Buffer_Max_Size    3MB
{{- end }}
