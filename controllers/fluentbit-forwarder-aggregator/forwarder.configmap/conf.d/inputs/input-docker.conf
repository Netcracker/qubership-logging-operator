{{- if .Values.Fluentbit.ContainerLogging }}
{{- if eq .Values.ContainerRuntimeType "docker" }}
[INPUT]
    Name               tail
    Tag                pods.*
    Path               /var/log/containers/*.log
{{- if .Values.Fluentbit.ExcludePath }}
    Exclude_Path       {{ .Values.Fluentbit.ExcludePath }}
{{- end }}
{{- if .Values.Fluentbit.DB.IsEnabled }}
    DB                 /var/log/containers.db
    DB.journal_mode    {{ default "memory" .Values.Fluentbit.DB.JournalMode }}
    DB.sync            {{ default "off" .Values.Fluentbit.DB.Sync }}
    DB.locking         {{ .Values.Fluentbit.DB.IsLocking }}
{{- end }}
    Read_from_Head     True
    Mem_Buf_Limit      10M
    Skip_Long_Lines    On
    Skip_Empty_Lines   On
    Refresh_Interval   60
    storage.type       {{ default "memory" .Values.Fluentbit.StorageType }}
    Buffer_Chunk_Size  64KB
    Buffer_Max_Size    3MB
    multiline.parser   docker
{{- end }}
{{- end }}
