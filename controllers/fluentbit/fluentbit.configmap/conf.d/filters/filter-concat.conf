# The multiline filters run with "buffer On", so each of them owns an emitter, which is an internal
# input with its own memory queue. These queues are the largest memory consumers of the pipeline:
# they grow while an output is unavailable, and FluentBit does not account them against the tail
# inputs. Keep the sum of emitter_mem_buf_limit well below the container memory limit. The emitters
# follow the configured storage type, so "filesystem" buffering covers them too.
[FILTER]
    name                   multiline
    Match                  pods*
    Flush_ms               2000
    multiline.key_content  log
    multiline.parser       multiline_qubership
    buffer                 On
    emitter_mem_buf_limit  32MB
    emitter_storage.type   {{ default "memory" .Values.Fluentbit.StorageType }}

[FILTER]
    Name                   multiline
    Match                  klog*
    Flush_ms               2000
    multiline.key_content  log
    multiline.parser       multiline_klog
    buffer                 On
    emitter_mem_buf_limit  32MB
    emitter_storage.type   {{ default "memory" .Values.Fluentbit.StorageType }}
