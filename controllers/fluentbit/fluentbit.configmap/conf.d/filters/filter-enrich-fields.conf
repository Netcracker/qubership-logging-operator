{{- if .Values.Fluentbit.MockKubeData }}
@INCLUDE /fluent-bit/etc/filter-kubernetes-mock.conf
{{- else }}

# Adds Kubernetes metadata, like pod name, namespace, container name, etc.
# Also reads suggested parser in a pod's annotation.
# If nothing is proposed, tries to parse log with json parser
# Parsed log is saved under log_parsed field
[FILTER]
    Name                 kubernetes
    Match                pods*
    Kube_URL             https://kubernetes.default.svc:443
    Kube_CA_File         /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File      /var/run/secrets/kubernetes.io/serviceaccount/token
{{- if eq .Values.ContainerRuntimeType "docker" }}
    Kube_Tag_Prefix      pods.var.log.containers.
{{- else }}
    Kube_Tag_Prefix      pods.var.log.pods.
    Regex_Parser         kube-meta
{{- end }}
    Merge_Log            On
    Merge_Log_Key        log_parsed
    K8S-Logging.Parser   On
    K8S-Logging.Exclude  Off
    Buffer_Size          0
{{- end }}

# Next, we will remove all unnecessary fields
[FILTER]
    Name                 nest
    Match                pods*
    Operation            lift
    Nested_under         kubernetes
    Remove_prefix        kubernetes.

# Rename the fields to be more consistent with Monitoring labels
[FILTER]
    Name                 modify
    Match                pods*
    Hard_rename          container_name container
    Hard_rename          namespace_name namespace
    Hard_rename          pod_name pod
    Hard_rename          stream stdio_stream

# Remove the fields that are not needed
[FILTER]
    Name                 record_modifier
    Match                pods*
    Allowlist_key        namespace
    Allowlist_key        pod
    Allowlist_key        container
    Allowlist_key        stdio_stream
    Allowlist_key        source
    Allowlist_key        labels
    Allowlist_key        log
    Allowlist_key        time
    Allowlist_key        level
    Allowlist_key        log_parsed

# Lift parsed payload fields with a temporary prefix so the reserved object can be removed
[FILTER]
    Name                 nest
    Match                pods*
    Operation            lift
    Nested_under         log_parsed
    Add_prefix           __payload_

# Remove the reserved object supplied by the application payload
[FILTER]
    Name                 modify
    Match                pods*
    Remove               __payload__record_metadata

# Rebuild the parsed payload without the reserved object
[FILTER]
    Name                 nest
    Match                pods*
    Operation            nest
    Wildcard             __payload_*
    Nest_under           log_parsed
    Remove_prefix        __payload_

# Count original fields before extracting parsed fields / passing generic filters
[FILTER]
    Name                 lua
    Match                pods*
    Script               /fluent-bit/etc/count_fields.lua
    Call                 first_count_fields

# Hide protected fields while application fields are extracted
[FILTER]
    Name                 nest
    Match                pods*
    Operation            nest
    Wildcard             namespace
    Wildcard             pod
    Wildcard             container
    Wildcard             stdio_stream
    Wildcard             source
    Wildcard             labels
    Wildcard             log
    Wildcard             time
    Wildcard             level
    Nest_under           _record_metadata

# Extract application fields without changing their names
[FILTER]
    Name                 nest
    Match                pods*
    Operation            lift
    Nested_under         log_parsed

# Move application fields that use protected names to their reserved parsed_ names
[FILTER]
    Name                 modify
    Match                pods*
    Hard_rename          namespace parsed_namespace
    Hard_rename          pod parsed_pod
    Hard_rename          container parsed_container
    Hard_rename          stdio_stream parsed_stdio_stream
    Hard_rename          source parsed_source
    Hard_rename          labels parsed_labels
    Hard_rename          log parsed_log
    Hard_rename          time parsed_time
    Hard_rename          level parsed_level
    Hard_rename          source_level parsed_source_level

# Restore authoritative fields
[FILTER]
    Name                 nest
    Match                pods*
    Operation            lift
    Nested_under         _record_metadata
