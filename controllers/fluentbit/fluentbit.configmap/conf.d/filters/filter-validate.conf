# Route a nonempty early result around the generic parser chain without lifting its payload.
[FILTER]
    Name                 modify
    Match_regex          (pods|klog).*
    Condition            Key_exists log_parsed
    Set                  __early_parsed true
    Set                  parse_status success
    Hard_rename          log original_log

[FILTER]
    Name                   rewrite_tag
    Match_regex            (pods|klog).*
    Rule                   $__early_parsed ^true$ parsed.$TAG false
    Emitter_Name           early_parsed_emitter
    Emitter_Storage.type   memory
    # Bound the emitter queue during output backpressure.
    Emitter_Mem_Buf_Limit  10M
