# First we count total fields in record after it went through parser proposed by pod's annotation
# or json parser if the annotation is not set
[FILTER]
    Name         lua
    Match_regex  (pods|klog).*
    Script       /fluent-bit/etc/count_fields.lua
    Call         second_count_fields

# Other parsers can lift the internal marker from a payload. Remove it unless the raw log matches Qubership format.
[FILTER]
    Name         modify
    Match        pods*
    Condition    Key_exists          __qubership_candidate
    Condition    Key_value_does_not_match   log   ^\[\d{4}-\d{2}-\d{2}[Tt\x20]\d{2}:\d{2}:\d{2}(?:[\.,]\d{1,9})?(?:[Zz]|[+-]\d{2}(?::?\d{2})?)?\]\s*\[\s*(?i:TRACE|DEBUG|INFO|WARN(?:ING)?|ERROR|FATAL)\s*\]
    Remove       __qubership_candidate

# Parse dynamic [key=value] labels only for records matched by the Qubership parser.
[FILTER]
    Name         lua
    Match        pods*
    script       /fluent-bit/etc/parse_key_value.lua
    call         kv_parse

[FILTER]
    Name                         modify
    Match_Regex                  pods.*grafana.*
    Condition Key_value_matches  parse_status  success
    Condition Key_value_matches  log /Invalid\susername\sor\spassword|Successful\sLogin|Successful\sLogout|Failed\sto\slook\sup\suser\sbased\son\scookie/
    Set                          nc_audit_label true

[FILTER]
    Name                         modify
    Match_Regex                  pods.*mongo.*
    Condition Key_value_matches  parse_status  success
    Condition Key_value_matches  log /ACCESS|CONTROL/
    Set                          nc_audit_label true

[FILTER]
    Name                         modify
    Match                        pods*
    Condition Key_value_matches  parse_status  success
    Condition Key_value_matches  log /access-control|PG_SERVICE|database\ssystem\sis|audit_log_type|AUDIT|logType[\":\s\t=]*audit|org\.qubership\.security\.audit.*CEF|org\.qubership\.cloud\.keycloak\.provider.*/
    Set                          nc_audit_label true

[FILTER]
    Name                         modify
    Match                        pods*
    Condition                    Key_value_matches  parse_status  success
    Condition                    Key_value_matches  log  ^\s*\{\s*"[^"]+"\s*:.*\}\s*$
    Set                          parse_format       json
    Rename                       msg                short_message
    Rename                       message            short_message

# If a record was parsed then
# copy log to short_message if short_message doesn't exist
# rename log field so it won't be processed further by generic chain of filters (to be removed at all in future releases)
[FILTER]
    Name                         modify
    Match_regex                  (pods|klog).*
    Condition                    Key_value_matches  parse_status  success
    Copy                         log                short_message
    Hard_rename                  log                original_log
