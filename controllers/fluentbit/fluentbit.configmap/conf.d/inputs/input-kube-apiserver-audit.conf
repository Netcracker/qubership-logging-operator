{{- if .Values.Fluentbit.KubeApiserverAuditLogging }}
[INPUT]
    Name               tail
    Tag                audit.*
    Path               /var/log/kube-apiserver/audit.log
    Path_Key           tag
    Parser             json_apiserver_kube
{{- if .Values.Fluentbit.DB.IsEnabled }}
    DB                 /var/log/kube-apiserver.db
    DB.journal_mode    {{ default "memory" .Values.Fluentbit.DB.JournalMode }}
    DB.sync            {{ default "off" .Values.Fluentbit.DB.Sync }}
    DB.locking         {{ .Values.Fluentbit.DB.IsLocking }}
{{- end }}
    Mem_Buf_Limit      {{ default "10M" .Values.Fluentbit.InputMemBufLimit }}
    Skip_Long_Lines    On
    Skip_Empty_Lines   On
    Refresh_Interval   60
    storage.type       {{ default "memory" .Values.Fluentbit.StorageType }}
    Buffer_Chunk_Size  64KB
    Buffer_Max_Size    3MB

{{- if .Values.OpenshiftDeploy }}
[INPUT]
    Name               tail
    Tag                audit.*
    Path               /var/log/openshift-apiserver/audit.log
    Path_Key           tag
    Parser             json_apiserver_kube
{{- if .Values.Fluentbit.DB.IsEnabled }}
    DB                 /var/log/openshift-apiserver.db
    DB.journal_mode    {{ default "memory" .Values.Fluentbit.DB.JournalMode }}
    DB.sync            {{ default "off" .Values.Fluentbit.DB.Sync }}
    DB.locking         {{ .Values.Fluentbit.DB.IsLocking }}
{{- end }}
    Mem_Buf_Limit      {{ default "10M" .Values.Fluentbit.InputMemBufLimit }}
    Skip_Long_Lines    On
    Skip_Empty_Lines   On
    Refresh_Interval   60
    storage.type       {{ default "memory" .Values.Fluentbit.StorageType }}
    Buffer_Chunk_Size  64KB
    Buffer_Max_Size    3MB
{{- end }}
{{- end }}
