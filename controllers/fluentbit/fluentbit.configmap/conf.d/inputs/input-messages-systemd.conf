{{- if .Values.Fluentbit.SystemLogging }}
{{- if eq .Values.Fluentbit.SystemLogType "systemd" }}
[INPUT]
    Name               systemd
    Tag                system.systemd
    Path               /var/log/journal
{{- if .Values.Fluentbit.DB.IsEnabled }}
    DB                 /var/log/flb-storage/journal.db
    DB.sync            {{ default "off" .Values.Fluentbit.DB.Sync }}
{{- end }}
    Read_from_Tail     On
    Strip_Underscores  True
    storage.type       {{ default "memory" .Values.Fluentbit.StorageType }}

[FILTER]
    Name               record_modifier
    Match              system.systemd
    Record             tag systemd
{{- end }}
{{- end }}
