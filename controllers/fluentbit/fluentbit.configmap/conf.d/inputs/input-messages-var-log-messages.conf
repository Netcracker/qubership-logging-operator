{{- if .Values.Fluentbit.SystemLogging }}
{{- if eq .Values.Fluentbit.SystemLogType "varlogmessages" }}
[INPUT]
    Name               tail
    Tag                system.*
    Path               /var/log/messages
    Path_Key           tag
    Parser             varlogmessages
{{- if .Values.Fluentbit.DB.IsEnabled }}
    DB                 /var/log/messages.db
    DB.journal_mode    {{ default "memory" .Values.Fluentbit.DB.JournalMode }}
    DB.sync            {{ default "off" .Values.Fluentbit.DB.Sync }}
    DB.locking         {{ .Values.Fluentbit.DB.IsLocking }}
{{- end }}
    Read_from_Head     False
    Mem_Buf_Limit      {{ default "10M" .Values.Fluentbit.InputMemBufLimit }}
    Skip_Long_Lines    On
    Skip_Empty_Lines   On
    Refresh_Interval   60
    storage.type       {{ default "memory" .Values.Fluentbit.StorageType }}
    Buffer_Chunk_Size  64KB
    Buffer_Max_Size    3MB
{{- end }}
{{- end }}
