apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: logging-fluentbit-logging
    app.kubernetes.io/managed-by: operator
    app.kubernetes.io/managed-by-operator: logging-operator
    app.kubernetes.io/name: logging-fluentbit
    app.kubernetes.io/part-of: logging-service
    app.kubernetes.io/technology: c
    component: logging-fluentbit
    kubernetes.io/cluster-service: "true"
    name: logging-fluentbit
    provider: kubernetes
  name: logging-fluentbit
  namespace: logging
spec:
  minReadySeconds: 60
  selector:
    matchLabels:
      component: logging-fluentbit
      provider: kubernetes
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: logging-fluentbit-logging
        app.kubernetes.io/managed-by: operator
        app.kubernetes.io/managed-by-operator: logging-operator
        app.kubernetes.io/name: logging-fluentbit
        app.kubernetes.io/part-of: logging-service
        app.kubernetes.io/technology: c
        component: logging-fluentbit
        kubernetes.io/cluster-service: "true"
        name: logging-fluentbit
        provider: kubernetes
      name: logging-fluentbit
    spec:
      containers:
      - args:
        - --volume-dir=/fluent-bit/etc
        - --webhook-url=http://localhost:2020/api/v2/reload
        - --webhook-retries=5
        name: configmap-reload
        ports:
        - containerPort: 9533
          name: reload-metrics
        resources:
          limits:
            cpu: 50m
            memory: 50Mi
          requests:
            cpu: 10m
            memory: 10Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - mountPath: /fluent-bit/etc
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
      - env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /
            port: 2020
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: logging-fluentbit
        ports:
        - containerPort: 2020
          name: http
          protocol: TCP
        - containerPort: 2021
          name: log-to-metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /api/v1/health
            port: 2020
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - DAC_OVERRIDE
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/log
          name: varlog
          readOnly: true
        - mountPath: /fluent-bit/state
          name: fluentbit-state
        - mountPath: /fluent-bit/etc
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: logging-fluentbit
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoExecute
        operator: Exists
      - effect: NoSchedule
        operator: Exists
      volumes:
      - hostPath:
          path: /var/log
          type: ""
        name: varlog
      - emptyDir:
          medium: Memory
          sizeLimit: 32Mi
        name: fluentbit-state
      - name: config
        secret:
          defaultMode: 420
          secretName: logging-fluentbit
      - emptyDir:
          sizeLimit: 100Mi
        name: tmp
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
status:
  currentNumberScheduled: 0
  desiredNumberScheduled: 0
  numberMisscheduled: 0
  numberReady: 0
