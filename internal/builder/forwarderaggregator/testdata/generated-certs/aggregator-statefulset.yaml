apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    agga: "true"
  labels:
    agg: x
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: logging-fluentbit-aggregator-logging
    app.kubernetes.io/managed-by: operator
    app.kubernetes.io/managed-by-operator: logging-operator
    app.kubernetes.io/name: logging-fluentbit-aggregator
    app.kubernetes.io/part-of: logging-service
    app.kubernetes.io/technology: c
    app.kubernetes.io/version: "3.0"
    component: logging-fluentbit-aggregator
    kubernetes.io/cluster-service: "true"
    name: logging-fluentbit-aggregator
    provider: kubernetes
  name: logging-fluentbit-aggregator
  namespace: logging
spec:
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      component: logging-fluentbit-aggregator
      name: logging-fluentbit-aggregator
      provider: kubernetes
  serviceName: logging-fluentbit-aggregator
  template:
    metadata:
      annotations:
        agga: "true"
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: logging-fluentbit-aggregator-logging
        app.kubernetes.io/managed-by: operator
        app.kubernetes.io/managed-by-operator: logging-operator
        app.kubernetes.io/name: logging-fluentbit-aggregator
        app.kubernetes.io/part-of: logging-service
        app.kubernetes.io/technology: c
        app.kubernetes.io/version: "3.0"
        component: logging-fluentbit-aggregator
        kubernetes.io/cluster-service: "true"
        name: logging-fluentbit-aggregator
        provider: kubernetes
      name: logging-fluentbit-aggregator
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: role
                operator: In
                values:
                - logging
      containers:
      - args:
        - --volume-dir=/fluent-bit/etc
        - --webhook-url=http://localhost:2020/api/v2/reload
        - --webhook-retries=5
        image: reload:1.0
        name: configmap-reload
        ports:
        - containerPort: 9533
          name: reload-metrics
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - mountPath: /fluent-bit/etc
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
      - image: fluent-bit:3.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /
            port: 2020
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: logging-fluentbit-aggregator
        ports:
        - containerPort: 2020
          name: http
          protocol: TCP
        - containerPort: 2021
          name: log-to-metrics
          protocol: TCP
        - containerPort: 24224
          name: forward
          protocol: TCP
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /api/v1/health
            port: 2020
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /fluent-bit/storage
          name: storage
        - mountPath: /fluent-bit/etc
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /fluent-bit/tls/ca.crt
          name: tls-ca
          readOnly: true
          subPath: ca.crt
        - mountPath: /fluent-bit/tls/tls.crt
          name: tls-cert
          readOnly: true
          subPath: tls.crt
        - mountPath: /fluent-bit/tls/tls.key
          name: tls-key
          readOnly: true
          subPath: tls.key
        - mountPath: /fluent-bit/output/loki/tls/ca.crt
          name: loki-tls-ca
          readOnly: true
          subPath: ca.crt
        - mountPath: /fluent-bit/output/loki/tls/tls.crt
          name: loki-tls-cert
          readOnly: true
          subPath: tls.crt
        - mountPath: /fluent-bit/output/loki/tls/tls.key
          name: loki-tls-key
          readOnly: true
          subPath: tls.key
        - mountPath: /fluent-bit/output/http/tls/ca.crt
          name: http-tls-ca
          readOnly: true
          subPath: ca.crt
        - mountPath: /fluent-bit/output/http/tls/tls.crt
          name: http-tls-cert
          readOnly: true
          subPath: tls.crt
        - mountPath: /fluent-bit/output/http/tls/tls.key
          name: http-tls-key
          readOnly: true
          subPath: tls.key
        - mountPath: /fluent-bit/output/otel/tls/ca.crt
          name: otel-tls-ca
          readOnly: true
          subPath: ca.crt
        - mountPath: /fluent-bit/output/otel/tls/tls.crt
          name: otel-tls-cert
          readOnly: true
          subPath: tls.crt
        - mountPath: /fluent-bit/output/otel/tls/tls.key
          name: otel-tls-key
          readOnly: true
          subPath: tls.key
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: agg-prio
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: logging-fluentbit-aggregator
      serviceAccountName: logging-fluentbit-aggregator
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: logging
      volumes:
      - name: config
        secret:
          defaultMode: 420
          secretName: logging-fluentbit-aggregator
      - emptyDir:
          sizeLimit: 100Mi
        name: tmp
      - name: tls-ca
        secret:
          defaultMode: 420
          secretName: agg-tls
      - name: tls-cert
        secret:
          defaultMode: 420
          secretName: agg-tls
      - name: tls-key
        secret:
          defaultMode: 420
          secretName: agg-tls
      - name: loki-tls-ca
        secret:
          defaultMode: 420
          secretName: ca-s
      - name: loki-tls-cert
        secret:
          defaultMode: 420
          secretName: crt-s
      - name: loki-tls-key
        secret:
          defaultMode: 420
          secretName: key-s
      - name: http-tls-ca
        secret:
          defaultMode: 420
          secretName: ca-s
      - name: http-tls-cert
        secret:
          defaultMode: 420
          secretName: crt-s
      - name: http-tls-key
        secret:
          defaultMode: 420
          secretName: key-s
      - name: otel-tls-ca
        secret:
          defaultMode: 420
          secretName: ca-s
      - name: otel-tls-cert
        secret:
          defaultMode: 420
          secretName: crt-s
      - name: otel-tls-key
        secret:
          defaultMode: 420
          secretName: key-s
  updateStrategy: {}
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: fast
    status: {}
status:
  availableReplicas: 0
  replicas: 0
