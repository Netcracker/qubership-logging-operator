apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: logging-fluentbit-aggregator-logging
    app.kubernetes.io/managed-by: operator
    app.kubernetes.io/managed-by-operator: logging-operator
    app.kubernetes.io/name: logging-fluentbit-aggregator
    app.kubernetes.io/part-of: logging-service
    app.kubernetes.io/technology: c
    component: logging-fluentbit-aggregator
    kubernetes.io/cluster-service: "true"
    name: logging-fluentbit-aggregator
    provider: kubernetes
  name: logging-fluentbit-aggregator
  namespace: logging
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      component: logging-fluentbit-aggregator
      name: logging-fluentbit-aggregator
      provider: kubernetes
  serviceName: logging-fluentbit-aggregator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: logging-fluentbit-aggregator-logging
        app.kubernetes.io/managed-by: operator
        app.kubernetes.io/managed-by-operator: logging-operator
        app.kubernetes.io/name: logging-fluentbit-aggregator
        app.kubernetes.io/part-of: logging-service
        app.kubernetes.io/technology: c
        component: logging-fluentbit-aggregator
        kubernetes.io/cluster-service: "true"
        name: logging-fluentbit-aggregator
        provider: kubernetes
      name: logging-fluentbit-aggregator
    spec:
      containers:
      - args:
        - --volume-dir=/fluent-bit/etc
        - --webhook-url=http://localhost:2020/api/v2/reload
        - --webhook-retries=5
        name: configmap-reload
        ports:
        - containerPort: 9533
          name: reload-metrics
        resources:
          limits:
            cpu: 50m
            memory: 50Mi
          requests:
            cpu: 10m
            memory: 10Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - mountPath: /fluent-bit/etc
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
      - imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /
            port: 2020
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: logging-fluentbit-aggregator
        ports:
        - containerPort: 2020
          name: http
          protocol: TCP
        - containerPort: 2021
          name: log-to-metrics
          protocol: TCP
        - containerPort: 24224
          name: forward
          protocol: TCP
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /api/v1/health
            port: 2020
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /fluent-bit/storage
          name: storage
        - mountPath: /fluent-bit/etc
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: logging-fluentbit-aggregator
      serviceAccountName: logging-fluentbit-aggregator
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          sizeLimit: 2Gi
        name: storage
      - name: config
        secret:
          defaultMode: 420
          secretName: logging-fluentbit-aggregator
      - emptyDir:
          sizeLimit: 100Mi
        name: tmp
  updateStrategy: {}
status:
  availableReplicas: 0
  replicas: 0
