apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: graylog
    app.kubernetes.io/instance: graylog-logging
    app.kubernetes.io/managed-by: operator
    app.kubernetes.io/managed-by-operator: logging-operator
    app.kubernetes.io/name: graylog
    app.kubernetes.io/part-of: logging-service
    app.kubernetes.io/technology: java-others
    app.kubernetes.io/version: 5.2.12
    name: graylog
  name: graylog
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      name: graylog
  serviceName: ""
  template:
    metadata:
      labels:
        app.kubernetes.io/component: graylog
        app.kubernetes.io/instance: graylog-logging
        app.kubernetes.io/managed-by: operator
        app.kubernetes.io/managed-by-operator: logging-operator
        app.kubernetes.io/name: graylog
        app.kubernetes.io/part-of: logging-service
        app.kubernetes.io/technology: java-others
        app.kubernetes.io/version: 5.2.12
        name: graylog
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - |
          mongod --wiredTigerEngineConfigString="cache_size=512M"
        image: docker.io/mongo:5.0.33@sha256:41108d183e972dcbf98d09ed83f6cfc89a471a3f15d06f9d64a95e45d9db8dd2
        imagePullPolicy: IfNotPresent
        name: mongo
        ports:
        - containerPort: 27017
          name: mongo
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - mountPath: /data/db
          name: mongodb
        - mountPath: /tmp
          name: tmp
      - command:
        - /bin/sh
        - -c
        - |
          if [ -f /tmp/kafka-logs/.lock ] ; then
              rm /tmp/kafka-logs/.lock
          fi

          /docker-entrypoint.sh
        env:
        - name: GRAYLOG_SERVER_JAVA_OPTS
          value: -Xms1024m -Xmx1024m -Djna.tmpdir=/usr/share/graylog/data/plugin
        - name: GRAYLOG_ELASTICSEARCH_HOSTS__FILE
          value: /usr/share/graylog/data/k8s-graylog-secret/elasticsearchHost
        - name: GRAYLOG_ROOT_USERNAME__FILE
          value: /usr/share/graylog/data/k8s-graylog-secret/user
        - name: GRAYLOG_ROOT_PASSWORD_SHA2__FILE
          value: /usr/share/graylog/data/k8s-graylog-secret/rootPasswordSha2
        - name: GRAYLOG_SNAPSHOT_DIRECTORY
          value: /usr/share/opensearch/snapshots/graylog/
        image: docker.io/graylog/graylog:5.2.12@sha256:3f4aa0885cd3e30442e5f7e1b2361f57773831bb84515386eb5dfa6f426fc1d7
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 120
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: graylog
        ports:
        - containerPort: 9000
          name: graylog
          protocol: TCP
        - containerPort: 514
          name: graylog-udp
          protocol: UDP
        - containerPort: 12201
          name: graylog-12201
          protocol: TCP
        - containerPort: 9833
          name: graylog-metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 120
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1100
          runAsNonRoot: true
          runAsUser: 1100
        volumeMounts:
        - mountPath: /usr/share/graylog/data/k8s-graylog-secret
          name: graylog-credentials-files
          readOnly: true
        - mountPath: /usr/share/graylog/data
          name: data
        - mountPath: /usr/share/graylog/plugin
          name: plugins
        - mountPath: /usr/share/graylog/plugins-merged
          name: plugins-merged
        - mountPath: /usr/share/graylog/data/config/log4j2.xml
          name: logsconf
          subPath: log4j2.xml
        - mountPath: /usr/share/graylog/data/config/graylog.conf
          name: graylogconf
          subPath: graylog.conf
        - mountPath: /usr/share/graylog/data/config/node-id
          name: nodeid
          subPath: node-id
        - mountPath: /tmp
          name: tmp
      initContainers:
      - command:
        - /bin/sh
        - -c
        - |
          chown -R 1001:1001 /data/db
          chmod -R u=rwX,g=rwX,o= /data/db

          mkdir -p /usr/share/graylog/data/archives
          mkdir -p /usr/share/graylog/data/config
          touch /usr/share/graylog/data/config/directories.json

          chown -R 1100:1100 /usr/share/graylog/data
          chmod -R u=rwX,g=rwX,o= /usr/share/graylog/data
          chmod 0660 /usr/share/graylog/data/config/directories.json
          printf '{}\n' > /usr/share/graylog/data/config/directories.json
        image: docker.io/alpine:3.24.3
        imagePullPolicy: IfNotPresent
        name: setup
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /usr/share/graylog/data
          name: data
        - mountPath: /data/db
          name: mongodb
      - env:
        - name: CUSTOM_PLUGINS
        - name: GRAYLOG_VERSION
          value: "5"
        image: ghcr.io/netcracker/qubership-graylog-plugins-init:0.2.0
        imagePullPolicy: IfNotPresent
        name: download-plugins
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - mountPath: /usr/share/graylog/plugin
          name: plugins
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: logging-graylog
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: graylog-claim
      - emptyDir:
          sizeLimit: 100Mi
        name: plugins
      - emptyDir:
          sizeLimit: 100Mi
        name: plugins-merged
      - name: mongodb
        persistentVolumeClaim:
          claimName: mongo-claim
      - configMap:
          defaultMode: 292
          items:
          - key: log4j2.xml
            path: log4j2.xml
          name: graylog-service
        name: logsconf
      - configMap:
          defaultMode: 292
          items:
          - key: graylog.conf
            path: graylog.conf
          name: graylog-service
        name: graylogconf
      - configMap:
          defaultMode: 438
          items:
          - key: node-id
            path: node-id
          name: graylog-service
        name: nodeid
      - emptyDir:
          sizeLimit: 100Mi
        name: tmp
      - name: graylog-credentials-files
        secret:
          defaultMode: 288
          items:
          - key: elasticsearchHost
            path: elasticsearchHost
          - key: user
            path: user
          - key: rootPasswordSha2
            path: rootPasswordSha2
          secretName: graylog-secret
  updateStrategy: {}
status:
  availableReplicas: 0
  replicas: 0
