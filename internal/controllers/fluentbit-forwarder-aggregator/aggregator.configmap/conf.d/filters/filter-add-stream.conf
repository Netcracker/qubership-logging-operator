# Every output receives the basic category in stream, whichever outputs are enabled.
# output-http.conf copies it to log_category, so the Loki label map and the OpenTelemetry
# stream fields keep reading stream when the HTTP output is enabled too.
[FILTER]
    Name   record_modifier
    Match_regex  (pods|klog).*
    Record stream container
[FILTER]
    Name   record_modifier
    Match  audit*
    Record stream audit
[FILTER]
    Name   record_modifier
    Match  system*
    Record stream system
[FILTER]
    Name   modify
    Match_regex  (pods|klog).*
    Condition Key_value_matches nc_audit_label true
    Set    stream audit
