[FILTER]
    Name   lua
    Match  pods*
    script /fluent-bit/etc/extract_hostname.lua
    call   extract_hostname

# Records without log_parsed were not parsed by the Kubernetes filter
[FILTER]
    Name            modify
    Match_regex     (pods|klog).*
    Set             parse_status failed

# The Kubernetes filter creates log_parsed only after successful parsing
[FILTER]
    Name            modify
    Match_regex     (pods|klog).*
    Condition       Key_exists log_parsed
    Set             parse_status success

# Lift parsed payload fields with a temporary prefix so the reserved object can be removed
[FILTER]
    Name            nest
    Match_regex     (pods|klog).*
    Operation       lift
    Nested_under    log_parsed
    Add_prefix      __payload_

# Remove the reserved object supplied by the application payload
[FILTER]
    Name            modify
    Match_regex     (pods|klog).*
    Remove          __payload__record_metadata

# Rebuild the parsed payload without the reserved object
[FILTER]
    Name            nest
    Match_regex     (pods|klog).*
    Operation       nest
    Wildcard        __payload_*
    Nest_under      log_parsed
    Remove_prefix   __payload_

# Hide protected fields while application fields are extracted
[FILTER]
    Name            nest
    Match_regex     (pods|klog).*
    Operation       nest
    Wildcard        namespace
    Wildcard        pod
    Wildcard        pod_id
    Wildcard        container
    Wildcard        stdio_stream
    Wildcard        source
    Wildcard        labels
    Wildcard        log
    Wildcard        time
    Wildcard        level
    Wildcard        parse_status
    Nest_under      _record_metadata

# Extract application fields without changing their names
[FILTER]
    Name            nest
    Match_regex     (pods|klog).*
    Operation       lift
    Nested_under    log_parsed

# Move application fields that use protected names to their reserved parsed_ names
[FILTER]
    Name            modify
    Match_regex     (pods|klog).*
    Hard_rename     namespace parsed_namespace
    Hard_rename     pod parsed_pod
    Hard_rename     pod_id parsed_pod_id
    Hard_rename     container parsed_container
    Hard_rename     stdio_stream parsed_stdio_stream
    Hard_rename     source parsed_source
    Hard_rename     labels parsed_labels
    Hard_rename     log parsed_log
    Hard_rename     time parsed_time
    Hard_rename     level parsed_level
    Hard_rename     parse_status parsed_parse_status
    Hard_rename     _parser_input parsed_parser_input

# Restore authoritative fields
[FILTER]
    Name            nest
    Match_regex     (pods|klog).*
    Operation       lift
    Nested_under    _record_metadata

[FILTER]
    Name            modify
    Match           klog*
    Copy            log _parser_input

[FILTER]
    Name            parser
    Match           klog*
    Key_Name        _parser_input
    Parser          klog_entry
    Reserve_Data    On
    Preserve_Key    Off

[FILTER]
    Name            parser
    Match           klog*
    Key_Name        _parser_input
    Parser          klog_trace_entry
    Reserve_Data    On
    Preserve_Key    Off
