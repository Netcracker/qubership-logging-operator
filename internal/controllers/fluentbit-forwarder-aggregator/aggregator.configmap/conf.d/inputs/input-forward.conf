# Every forwarder connection allocates Buffer_Chunk_Size up front and grows up to Buffer_Max_Size,
# so the chunk size multiplies by the number of nodes. Forwarders send chunks of about 2MB, which
# leaves a large margin below Buffer_Max_Size.
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   100M
    mem_buf_limit     {{ default "200M" .Values.Fluentbit.Aggregator.InputMemBufLimit }}
    storage.type      memory
