# The multiline filters run with "buffer On", so each of them owns an emitter: an internal input
# with its own memory queue. The queues grow while an output is unavailable, and Mem_Buf_Limit of
# the tail inputs does not cover them. Keep the sum of emitter_mem_buf_limit well below the
# container memory limit: two emitters of 256MB used to reach the default 512Mi limit on their own.
[FILTER]
    name                   multiline
    Match                  pods*
    Flush_ms               2000
    multiline.key_content  log
    multiline.parser       multiline_qubership, java, go, multiline_python
    buffer                 On
    emitter_storage.type   {{ if .Values.Fluentbit.UsesFilesystemBuffer }}filesystem{{ else }}memory{{ end }}
    emitter_mem_buf_limit  32MB

[FILTER]
    Name                   multiline
    Match                  klog*
    Flush_ms               2000
    multiline.key_content  log
    multiline.parser       multiline_klog
    buffer                 On
    emitter_storage.type   {{ if .Values.Fluentbit.UsesFilesystemBuffer }}filesystem{{ else }}memory{{ end }}
    emitter_mem_buf_limit  32MB
