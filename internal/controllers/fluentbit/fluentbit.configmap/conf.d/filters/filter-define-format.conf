[FILTER]
    Name               modify
    Match_regex        (pods|klog).*
    Condition          Key_exists          klog_date
    Set                parse_format        klog

[FILTER]
    Name               modify
    Match_regex        ^(?:klog\.)?pods\.(?:[^.]+\.)?var\.log\.(?:pods\.[^_]+_.*|containers\.(?:[^_]*_[^_]*_.*|[^_]*))coredns
    Condition          Key_exists          module
    Set                parse_format        coredns

[FILTER]
    Name               modify
    Match_regex        ^pods\.(?:[^.]+\.)?var\.log\.(?:pods\.[^_]+_.*|containers\.(?:[^_]*_[^_]*_.*|[^_]*))nginx
    Condition          Key_exists          method
    Condition          Key_exists          path
    Condition          Key_exists          code
    Set                parse_format        k8s-nginx-ingress

[FILTER]
    Name               modify
    Match_regex        ^pods\.(?:[^.]+\.)?var\.log\.(?:pods\.[^_]+_.*|containers\.(?:[^_]*_[^_]*_.*|[^_]*))cassandra
    Condition          Key_exists          method
    Set                parse_format        cassandra

[FILTER]
    Name               modify
    Match_regex        ^pods\.(?:[^.]+\.)?var\.log\.(?:pods\.[^_]+_.*|containers\.(?:[^_]*_[^_]*_.*|[^_]*))opensearch
    Condition          Key_exists          opensearch_node
    Condition          Key_exists          logger
    Set                parse_format        opensearch

[FILTER]
    Name               modify
    Match_regex        ^pods\.(?:[^.]+\.)?var\.log\.(?:pods\.[^_]+_.*|containers\.(?:[^_]*_[^_]*_.*|[^_]*))fluentbit
    Condition          Key_exists          component
    Set                parse_format        fluentbit

# Names the MongoDB structured log format. No parser of that name runs: filter-generic.conf parses
# these records as JSON and renames their fields.
[FILTER]
    Name               modify
    Match_regex        ^pods\.(?:[^.]+\.)?var\.log\.(?:(?:pods\.[^_]+_.*|containers\.(?:[^_]*_[^_]*_.*|[^_]*))cnfrs|pods\.[^_]+_[^_]*graylog[^_]*_[^.]+\.[^.]*mongo|containers\.[^_]*graylog[^_]*_[^_]+_[^_]*mongo)
    Condition          Key_exists          component
    Condition          Key_exists          id
    Condition          Key_exists          context
    Set                parse_format        mongodb_structured

[FILTER]
    Name               modify
    Match_regex        (pods|klog).*
    Condition          Key_does_not_exist  parse_format
    Set                parse_format        unknown
