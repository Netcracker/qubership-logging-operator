{{- if .Values.Fluentbit.SystemLogging }}
{{- if eq .Values.Fluentbit.SystemLogType "systemd" }}
[INPUT]
    Name               systemd
    Tag                system.systemd
    Path               /var/log/journal
{{- if .Values.Fluentbit.DB.IsEnabled }}
    DB                 /fluent-bit/state/journal.db
    DB.sync            {{ default "off" .Values.Fluentbit.DB.Sync }}
{{- end }}
    Read_from_Tail     On
    Strip_Underscores  True
    Mem_Buf_Limit      {{ default "10M" .Values.Fluentbit.InputMemBufLimit }}
    storage.type       {{ if .Values.Fluentbit.UsesFilesystemBuffer }}filesystem{{ else }}memory{{ end }}

[FILTER]
    Name               record_modifier
    Match              system.systemd
    Record             tag systemd
{{- end }}
{{- end }}
