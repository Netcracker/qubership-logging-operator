# Mark audit records with nc_audit_label, using the same rules as the Fluent Bit pipeline
# (filter-post-generic.conf). A single filter evaluates every rule, so a later rule cannot reset the
# label that an earlier one set:
# * any container: the generic audit markers in the log text
# * pod or container name contains "grafana": login and logout messages
# * pod or container name contains "mongo": ACCESS and CONTROL messages
# The names come from the pod and container part of the tag, never from the namespace. The tag is
# var.log.pods.<namespace>_<pod>_<uid>.<container>.<n>.log for containerd and CRI-O, and
# var.log.containers.<pod>_<namespace>_<container>-<id>.log for Docker.
<filter parsed.kubernetes.var.log.**>
  @type record_transformer
  enable_ruby
  <record>
    nc_audit_label ${ log = record["log"]; names = (m = /\Aparsed\.kubernetes\.var\.log\.pods\.[^_]+_(.*)/.match(tag)) ? m[1] : ((m = /\Aparsed\.kubernetes\.var\.log\.containers\.([^_]*)(?:_[^_]*_(.*))?/.match(tag)) ? m[1] + " " + m[2].to_s : ""); log.respond_to?(:to_str) && ( /access-control|PG_SERVICE|database\ssystem\sis|audit_log_type|AUDIT|logType[":\s\t=]*audit|org\.qubership\.security\.audit.*CEF|org\.qubership\.cloud\.keycloak\.provider/.match?(log) || ( names.include?("grafana") && /Invalid\susername\sor\spassword|Successful\sLogin|Successful\sLogout|Failed\sto\slook\sup\suser\sbased\son\scookie/.match?(log) ) || ( names.include?("mongo") && /ACCESS|CONTROL/.match?(log) ) ) ? "true" : "false" }
  </record>
</filter>
