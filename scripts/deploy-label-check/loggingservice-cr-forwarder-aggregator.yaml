# LoggingService CR with Fluent Bit forwarder + aggregator (replaces standalone Fluent Bit).
# Creates: logging-fluentbit-forwarder DaemonSet, logging-fluentbit-forwarder Service,
#          logging-fluentbit-aggregator StatefulSet, logging-fluentbit-aggregator Service,
#          plus cloud-events-reader.
# Apply: kubectl apply -f scripts/deploy-label-check/loggingservice-cr-forwarder-aggregator.yaml -n logging
#
# Note: Aggregator will try to reach Graylog (not installed); pods may have flush warnings.
# Resources will be created with correct labels for verification.
---
apiVersion: logging.netcracker.com/v1
kind: LoggingService
metadata:
  name: qubership-logging
  namespace: logging
  labels:
    app.kubernetes.io/name: qubership-logging
    app.kubernetes.io/component: logging-operator
    app.kubernetes.io/part-of: logging
spec:
  openshiftDeploy: false
  osKind: centos
  ipv6: false
  containerRuntimeType: containerd
  fluentbit:
    dockerImage: docker.io/fluent/fluent-bit:4.0.1
    configmapReload:
      dockerImage: ghcr.io/jimmidyson/configmap-reload:v0.15.0
    systemLogging: true
    systemLogType: varlogmessages
    graylogOutput: true
    graylogHost: graylog-service
    graylogPort: 12201
    containerLogging: true
    watchKubernetesMetadata: true
    customInputConf: ""
    customFilterConf: ""
    customOutputConf: ""
    aggregator:
      install: true
      dockerImage: docker.io/fluent/fluent-bit:4.0.1
      replicas: 1
      graylogOutput: true
      graylogHost: graylog-service
      graylogPort: 12201
  cloudEventsReader:
    install: true
    dockerImage: ghcr.io/netcracker/qubership-kube-events-reader:main
