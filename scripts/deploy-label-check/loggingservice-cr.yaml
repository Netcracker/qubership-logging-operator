# Minimal LoggingService CR for the qubership-logging-operator.
# Apply this when the operator is already running and you want it to deploy Fluent Bit + cloud-events-reader:
#   kubectl apply -f scripts/deploy-label-check/loggingservice-cr.yaml -n logging
# The operator will reconcile and create the Fluent Bit DaemonSet and cloud-events-reader Deployment.
# Same namespace as the operator (logging) unless you change metadata.namespace.
---
apiVersion: logging.netcracker.com/v1
kind: LoggingService
metadata:
  name: qubership-logging
  namespace: logging
  labels:
    app.kubernetes.io/name: qubership-logging
    app.kubernetes.io/component: logging-operator
    app.kubernetes.io/part-of: logging
spec:
  openshiftDeploy: false
  osKind: centos
  ipv6: false
  containerRuntimeType: containerd
  fluentbit:
    dockerImage: docker.io/fluent/fluent-bit:4.0.1
    configmapReload:
      dockerImage: ghcr.io/jimmidyson/configmap-reload:v0.15.0
    systemLogging: true
    systemAuditLogging: false
    kubeAuditLogging: false
    kubeApiserverAuditLogging: false
    containerLogging: true
    systemLogType: varlogmessages
    graylogOutput: true
    graylogHost: graylog-service
    graylogPort: 12201
    securityContextPrivileged: false
    watchKubernetesMetadata: true
    billCycleConf: false
    customInputConf: ""
    customFilterConf: ""
    customOutputConf: ""
  cloudEventsReader:
    install: true
    dockerImage: ghcr.io/netcracker/qubership-kube-events-reader:main
