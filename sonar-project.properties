sonar.sources=.
sonar.exclusions=**/*_test.go,api/v1/**,scripts/**
sonar.coverage.exclusions=test/robot-tests/**,test/fluent-pipeline/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.language=go
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12,3.13,3.14

# Exception for http protocol in victorialogs URL. It's sufficient for tests workflow.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/integration-tests.yaml

# Base images are pinned with both a version tag and a digest. Renovate reads the version from the
# tag and keeps the digest current, so dropping either one would weaken dependency updates.
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile
