# The deprecated bill cycle option of the Fluent Bit templates. It used to include a filter file that no template
# renders, and Fluent Bit refused the configuration. The option has no effect now, and the configuration must load.
apiVersion: logging.netcracker.com/v1
kind: LoggingService
metadata:
  name: logging-service
spec:
  containerRuntimeType: containerd
  fluentbit:
    multilineFirstLineRegexp: "/^(\\[\\d{4}\\-\\d{2}\\-\\d{2}).*/"
    multilineOtherLinesRegexp: "/^(?!\\[\\d{4}\\-\\d{2}\\-\\d{2}).*/"
    containerLogging: true
    billCycleConf: true
    mockKubeData: true
    graylogOutput: true
    graylogHost: graylog.logging.svc
    graylogPort: 12201
    graylogProtocol: tcp
