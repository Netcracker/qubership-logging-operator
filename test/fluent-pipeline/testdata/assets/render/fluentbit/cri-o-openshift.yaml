# CRI-O on OpenShift: the OpenShift audit inputs and the CRI tag prefix.
apiVersion: logging.netcracker.com/v1
kind: LoggingService
metadata:
  name: logging-service
spec:
  containerRuntimeType: cri-o
  openshiftDeploy: true
  cloudEventsReader:
    install: true
  fluentbit:
    multilineFirstLineRegexp: "/^(\\[\\d{4}\\-\\d{2}\\-\\d{2}).*/"
    multilineOtherLinesRegexp: "/^(?!\\[\\d{4}\\-\\d{2}\\-\\d{2}).*/"
    containerLogging: true
    systemLogging: true
    systemLogType: varlogmessages
    systemAuditLogging: true
    kubeAuditLogging: true
    kubeApiserverAuditLogging: true
    watchKubernetesMetadata: true
    mockKubeData: false
    graylogOutput: true
    graylogHost: graylog.logging.svc
    graylogPort: 12201
    graylogProtocol: udp
