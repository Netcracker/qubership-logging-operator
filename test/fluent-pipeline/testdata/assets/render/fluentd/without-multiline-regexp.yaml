# expect-failure: filter-multiline.conf renders an empty multiline_start_regexp and the concat filter refuses it
# A custom resource without multilineFirstLineRegexp. The chart always sets one, and the template
# has no default of its own, so Fluentd fails to start on a custom resource written by hand.
apiVersion: logging.netcracker.com/v1
kind: LoggingService
metadata:
  name: logging-service
spec:
  containerRuntimeType: containerd
  fluentd:
    containerLogging: true
    mockKubeData: true
    graylogOutput: true
    graylogHost: graylog.logging.svc
    graylogPort: 12201
    graylogProtocol: tcp
    output:
      loki:
        enabled: false
